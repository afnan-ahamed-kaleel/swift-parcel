<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>Reset Password - SwiftParcel</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    
    <!-- PWA Setup -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
  </head>
  <body class="bg-slate-900 min-h-screen text-slate-800 font-outfit antialiased flex items-center justify-center relative overflow-hidden p-4">
    
    <!-- Floating animated glowing blobs for background -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[40%] h-[40%] bg-indigo-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob animation-delay-2000"></div>

    <!-- The Single Glass Container -->
    <div class="w-full max-w-4xl bg-white/10 backdrop-blur-2xl border border-white/20 rounded-[2.5rem] shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] overflow-hidden relative flex flex-col md:flex-row min-h-[550px] z-10">
      
      <!-- Mobile: Lottie inside container as background -->
      <div class="absolute inset-0 z-0 md:hidden flex items-center justify-center opacity-25 pointer-events-none">
         <dotlottie-player src="/theme.lottie" autoplay loop class="w-full h-full object-cover scale-150"></dotlottie-player>
      </div>

      <!-- Left Side: Form -->
      <div class="w-full md:w-1/2 p-8 md:p-12 relative z-10 flex flex-col justify-center">
        <div class="flex flex-col items-center mb-6">
          <div class="w-14 h-14 bg-gradient-to-tr from-amber-500 to-orange-500 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-500/30 overflow-hidden mb-3 relative z-20">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
          </div>
          <h1 class="text-2xl font-extrabold text-white tracking-tight drop-shadow-md">Reset Password</h1>
        </div>

        <!-- Success Message (Hidden initially) -->
        <div id="successMessage" class="hidden bg-emerald-500/20 backdrop-blur-md border border-emerald-500/40 text-emerald-300 text-sm font-bold p-4 rounded-xl flex-col items-center justify-center text-center gap-3 shadow-lg relative z-20 mb-6">
          <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>Your password has been reset successfully! You can now login with your new password.</span>
          <a href="/login.html" class="mt-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-colors w-full">Go to Login</a>
        </div>

        <form id="resetForm" class="space-y-4 relative z-20">
          <div>
            <label class="block text-[10px] font-bold text-blue-200 uppercase tracking-widest mb-1.5">Username</label>
            <input type="text" id="username" class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-xl focus:border-amber-500 focus:ring-2 focus:ring-amber-500/50 outline-none font-bold text-white shadow-inner transition-all placeholder-slate-500 backdrop-blur-md" placeholder="Enter your username" required>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-blue-200 uppercase tracking-widest mb-1.5">Registered Email / Mobile</label>
            <input type="text" id="contactInfo" class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-xl focus:border-amber-500 focus:ring-2 focus:ring-amber-500/50 outline-none font-bold text-white shadow-inner transition-all placeholder-slate-500 backdrop-blur-md" placeholder="Verify your email or 10-digit mobile" required>
          </div>
          
          <div>
            <label class="block text-[10px] font-bold text-blue-200 uppercase tracking-widest mb-1.5">New Password</label>
            <input type="password" id="password" class="w-full px-4 py-3 bg-slate-900/60 border border-white/10 rounded-xl focus:border-amber-500 focus:ring-2 focus:ring-amber-500/50 outline-none font-bold text-white shadow-inner transition-all placeholder-slate-500 backdrop-blur-md" placeholder="Create new password" required autocomplete="new-password">
          </div>

          <div id="errorMessage" class="hidden bg-rose-500/20 backdrop-blur-md border border-rose-500/40 text-rose-300 text-xs font-bold p-3 rounded-lg flex items-start gap-2 shadow-lg">
            <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <span id="errorText"></span>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3.5 mt-2 bg-gradient-to-r from-amber-600 to-orange-600 text-white rounded-xl hover:shadow-[0_0_20px_rgba(245,158,11,0.5)] hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] font-extrabold flex items-center justify-center gap-2 transition-all border border-amber-400/30">
            <span id="btnText">Reset Password</span>
            <svg id="btnSpinner" class="hidden w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          </button>
        </form>

        <div class="mt-5 text-center relative z-20">
          <p class="text-slate-400 text-sm font-medium">Remembered it? <a href="/login.html" class="text-blue-400 hover:text-blue-300 font-bold underline transition-colors">Back to Login</a></p>
        </div>
      </div>

      <!-- Right Side: Theme Lottie Animation (Desktop Only) inside container -->
      <div class="hidden md:flex md:w-1/2 relative items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-900/40 to-slate-900/40"></div>
        <div class="w-[300px] h-[300px] absolute bg-amber-500/20 filter blur-[100px] rounded-full animate-pulse"></div>
        <dotlottie-player src="/theme.lottie" autoplay loop class="w-full h-full max-w-sm object-contain relative z-20 drop-shadow-2xl hover:scale-105 transition-transform duration-700"></dotlottie-player>
      </div>

    </div>

    <script type="module" src="./forgot_password.js"></script>
  </body>
</html>
