<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- STRICT MOBILE VIEWPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>SwiftParcel Dashboard</title>
    <!-- Modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="bg-slate-50 min-h-screen text-slate-800 font-outfit antialiased pb-28 md:pb-12 overflow-x-hidden selection:bg-blue-200">
    
    <!-- Top App Bar (Responsive) -->
    <header class="bg-white/90 backdrop-blur-xl shadow-sm border-b border-slate-200 sticky top-0 z-30 px-5 py-3 md:py-4 flex items-center justify-between no-print transition-all">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 md:w-12 md:h-12 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl md:rounded-2xl flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-indigo-700 tracking-tight leading-none">SwiftParcel</h1>
          <p class="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest mt-0.5">Courier Hub</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <!-- Desktop Scan Button (Hidden on Mobile) -->
        <button id="desktopScanBtn" class="hidden md:flex items-center justify-center gap-2 px-6 py-2.5 text-sm font-extrabold text-white bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl shadow-[0_5px_15px_rgba(79,70,229,0.3)] hover:scale-105 active:scale-95 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Scan AI Label
        </button>
        <button id="printBtn" class="p-2.5 text-slate-500 hover:text-blue-600 bg-slate-100 rounded-full transition-colors active:scale-90 active:bg-blue-50" title="Print Report">
          <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
        </button>
      </div>
    </header>

    <main class="px-4 py-6 w-full max-w-7xl mx-auto no-print">
      
      <!-- Responsive Stats Grid (Filter Buttons) -->
      <div class="grid grid-cols-4 gap-2 md:gap-4 mb-6 no-print">
        <!-- Stat Card 1 -->
        <button onclick="setFilter('All')" id="filter-All" class="filter-btn opacity-100 scale-100 border-slate-200 shadow-md bg-white rounded-xl p-2 md:p-4 transition-all border-2 flex flex-col items-center justify-center text-center relative overflow-hidden text-left w-full active:scale-95">
          <div class="absolute -top-4 -right-4 w-10 h-10 bg-blue-50 rounded-full opacity-50"></div>
          <p class="text-[8px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5 relative z-10 leading-tight">All</p>
          <p id="stat-total" class="text-lg md:text-2xl font-extrabold text-blue-600 relative z-10 leading-none">0</p>
        </button>
        <!-- Stat Card 2 -->
        <button onclick="setFilter('Pending')" id="filter-Pending" class="filter-btn opacity-60 scale-95 border-transparent bg-white rounded-xl p-2 md:p-4 transition-all border-2 flex flex-col items-center justify-center text-center relative overflow-hidden text-left w-full active:scale-95">
          <div class="absolute -top-4 -right-4 w-10 h-10 bg-amber-50 rounded-full opacity-50"></div>
          <p class="text-[8px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5 relative z-10 leading-tight">Pending</p>
          <p id="stat-pending" class="text-lg md:text-2xl font-extrabold text-amber-500 relative z-10 leading-none">0</p>
        </button>
        <!-- Stat Card 3 -->
        <button onclick="setFilter('Delivered')" id="filter-Delivered" class="filter-btn opacity-60 scale-95 border-transparent bg-white rounded-xl p-2 md:p-4 transition-all border-2 flex flex-col items-center justify-center text-center relative overflow-hidden text-left w-full active:scale-95">
          <div class="absolute -top-4 -right-4 w-10 h-10 bg-emerald-50 rounded-full opacity-50"></div>
          <p class="text-[8px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5 relative z-10 leading-tight">Delivered</p>
          <p id="stat-delivered" class="text-lg md:text-2xl font-extrabold text-emerald-500 relative z-10 leading-none">0</p>
        </button>
        <!-- Stat Card 4 -->
        <button onclick="setFilter('Canceled')" id="filter-Canceled" class="filter-btn opacity-60 scale-95 border-transparent bg-white rounded-xl p-2 md:p-4 transition-all border-2 flex flex-col items-center justify-center text-center relative overflow-hidden text-left w-full active:scale-95">
          <div class="absolute -top-4 -right-4 w-10 h-10 bg-rose-50 rounded-full opacity-50"></div>
          <p class="text-[8px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5 relative z-10 leading-tight">Canceled</p>
          <p id="stat-canceled" class="text-lg md:text-2xl font-extrabold text-rose-500 relative z-10 leading-none">0</p>
        </button>
      </div>

      <!-- Packages Header -->
      <h2 class="text-lg md:text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2">
        <span class="w-1.5 md:w-2 h-5 md:h-7 rounded-full bg-blue-500 block"></span>
        Active Parcels
      </h2>

      <!-- Packages Container (Grid on Desktop, Column on Mobile) -->
      <div id="packagesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Loading State -->
        <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 flex flex-col items-center justify-center text-slate-400 col-span-full min-h-[300px]">
           <svg class="w-10 h-10 text-blue-400 mb-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
           <span class="text-sm font-bold tracking-wide uppercase">Syncing Database...</span>
        </div>
      </div>
    </main>

    <!-- Floating Action Button (FAB) for Mobile Only -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center z-30 pointer-events-none no-print pb-safe md:hidden">
      <button id="mobileScanBtn" class="pointer-events-auto flex items-center justify-center gap-2 px-8 py-4 text-base font-extrabold text-white bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full shadow-[0_10px_40px_rgba(79,70,229,0.4)] active:scale-95 transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span>Scan Label</span>
      </button>
    </div>

    <!-- Live Camera High-Tech Scanner Modal -->
    <div id="cameraScannerModal" class="fixed inset-0 bg-black z-[120] hidden flex-col">
      <div class="relative flex-1 overflow-hidden bg-slate-900">
        <!-- Live Video Feed -->
        <video id="cameraFeed" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline></video>
        
        <!-- High-Tech UI Overlay -->
        <div class="absolute inset-0 z-10 flex items-center justify-center pointer-events-none">
          <!-- Scanning Frame -->
          <div class="w-64 h-64 sm:w-80 sm:h-80 relative border border-blue-500/30 bg-blue-500/10">
            <!-- Corners -->
            <div class="absolute -top-1 -left-1 w-8 h-8 border-t-4 border-l-4 border-blue-500 rounded-tl-lg shadow-[0_0_15px_#3b82f6]"></div>
            <div class="absolute -top-1 -right-1 w-8 h-8 border-t-4 border-r-4 border-blue-500 rounded-tr-lg shadow-[0_0_15px_#3b82f6]"></div>
            <div class="absolute -bottom-1 -left-1 w-8 h-8 border-b-4 border-l-4 border-blue-500 rounded-bl-lg shadow-[0_0_15px_#3b82f6]"></div>
            <div class="absolute -bottom-1 -right-1 w-8 h-8 border-b-4 border-r-4 border-blue-500 rounded-br-lg shadow-[0_0_15px_#3b82f6]"></div>
            
            <!-- Scanning Laser -->
            <div class="absolute top-0 left-0 w-full h-[2px] bg-blue-400 shadow-[0_0_20px_#60a5fa] animate-laser"></div>
            
            <!-- Target Crosshair -->
            <div class="absolute inset-0 flex items-center justify-center opacity-30">
              <div class="w-px h-16 bg-blue-400"></div>
              <div class="h-px w-16 bg-blue-400 absolute"></div>
            </div>
          </div>
          
          <!-- Instructions Overlay -->
          <div class="absolute top-10 left-0 right-0 text-center animate-pulse">
            <p class="text-blue-400 font-bold uppercase tracking-widest text-sm bg-black/50 inline-block px-4 py-1.5 rounded-full backdrop-blur-sm border border-blue-500/50">Align Label Within Frame</p>
          </div>
        </div>
      </div>
      <!-- Camera Controls -->
      <div class="bg-black border-t border-slate-800 pb-safe pt-6 px-8 flex justify-between items-center h-32 no-print z-20 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <button id="closeCameraBtn" class="text-white bg-slate-800 hover:bg-slate-700 px-6 py-3.5 rounded-full font-bold transition-colors shadow-lg border border-slate-700">Cancel</button>
        <!-- Capture Shutter Button -->
        <button id="captureBtn" class="w-[72px] h-[72px] rounded-full border-[6px] border-blue-500 bg-white shadow-[0_0_30px_#3b82f6] active:scale-90 active:bg-blue-100 transition-all relative">
          <div class="absolute inset-0 rounded-full border-2 border-white/50 m-1"></div>
        </button>
        <div class="w-24"></div> <!-- Spacer for flex balance -->
      </div>
    </div>

    <!-- Custom Toast Alert Container -->
    <div id="toastContainer" class="fixed top-6 md:top-10 left-0 right-0 z-[130] flex flex-col items-center gap-2 pointer-events-none px-4"></div>

    <!-- Verification Modal (Bottom Sheet on Mobile, Centered Modal on Desktop) -->
    <div id="verifyModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden items-end sm:items-center justify-center z-[100] opacity-0 transition-opacity duration-300 no-print">
      <div class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-2xl h-[88vh] sm:h-auto flex flex-col transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-300" id="verifyModalContent">
        <div class="px-6 md:px-8 py-5 border-b border-slate-100 flex justify-between items-center bg-white rounded-t-3xl sm:rounded-t-3xl z-10 sticky top-0">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
              <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            </div>
            <div>
              <h2 id="modalTitle" class="text-lg md:text-xl font-extrabold text-slate-800 tracking-tight">Verify Extraction</h2>
              <p class="hidden md:block text-xs font-semibold text-slate-500 mt-0.5">Review parcel data before saving.</p>
            </div>
          </div>
          <button id="closeModalBtn" class="text-slate-400 hover:text-slate-700 bg-slate-50 rounded-full p-2.5 hover:bg-slate-100 transition-colors">
            <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        
        <div class="p-6 md:p-8 overflow-y-auto flex-1 bg-slate-50/50">
          <form id="verifyForm" class="space-y-5 md:space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
              <div class="md:col-span-2">
                <label class="block text-[11px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Recipient Name</label>
                <input type="text" id="v-client" class="w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none font-bold text-slate-800 shadow-sm transition-all" required>
              </div>
              <div class="md:col-span-2">
                <label class="block text-[11px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Delivery Address</label>
                <textarea id="v-delivery" rows="3" class="w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none font-bold text-slate-800 shadow-sm resize-none transition-all" required></textarea>
              </div>
              <div>
                <label class="block text-[11px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Primary Phone</label>
                <input type="text" id="v-phone1" class="w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none font-bold text-slate-800 shadow-sm transition-all">
              </div>
              <div>
                <label class="block text-[11px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Secondary Phone</label>
                <input type="text" id="v-phone2" class="w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none font-bold text-slate-800 shadow-sm transition-all">
              </div>
              <div class="md:col-span-2">
                <label class="block text-[11px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Sender Information (Return)</label>
                <textarea id="v-sender" rows="2" class="w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none font-semibold text-slate-700 shadow-sm resize-none transition-all"></textarea>
              </div>
            </div>
          </form>
        </div>
        
        <div class="px-6 md:px-8 py-5 bg-white border-t border-slate-100 flex gap-3 md:gap-4 pb-safe">
          <button id="cancelModalBtn" class="flex-1 py-4 text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl font-extrabold transition-colors">Cancel</button>
          <button id="saveDataBtn" class="flex-[2] py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:shadow-[0_10px_20px_rgba(79,70,229,0.3)] hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] font-extrabold shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 transition-all">
            <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="saveBtnText">Save Package</span>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Restored Dark Glassmorphism Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-lg hidden items-center justify-center z-[110] flex-col gap-6">
      <div class="relative w-28 h-28">
        <div class="absolute inset-0 border-[4px] border-white/10 rounded-full"></div>
        <div class="absolute inset-0 border-[4px] border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <div class="absolute inset-0 flex items-center justify-center text-blue-400">
           <svg class="w-12 h-12 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
        </div>
      </div>
      <p class="text-white font-extrabold text-2xl tracking-tight drop-shadow-lg" id="loadingText">Analyzing Content...</p>
    </div>

    <!-- Developer Debug Panel (Auto-catches errors) -->
    <div id="devDebugPanel" class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t-4 border-red-500 text-red-400 font-mono text-xs md:text-sm z-[200] max-h-[50vh] overflow-y-auto hidden no-print shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
      <div class="flex justify-between items-center bg-slate-800 px-4 py-2.5 sticky top-0 shadow-md">
        <span class="font-bold text-white flex items-center gap-2 tracking-wider">
          <svg class="w-4 h-4 text-red-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          SYSTEM ERROR LOGGER
        </span>
        <button onclick="document.getElementById('devDebugPanel').classList.add('hidden'); document.getElementById('devDebugLogs').innerHTML=''" class="text-slate-300 hover:text-white bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition-colors uppercase font-bold text-[10px]">Dismiss</button>
      </div>
      <div id="devDebugLogs" class="p-4 space-y-3 pb-8"></div>
    </div>

    <!-- Print Preview Modal -->
    <div id="printModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm hidden flex-col z-[250] print:block print:bg-white print:static print:z-auto">
      <div class="bg-white flex-1 w-full max-w-4xl mx-auto overflow-y-auto flex flex-col shadow-2xl print:shadow-none print:max-w-none">
        <!-- Print Modal Header (Hidden on actual print) -->
        <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center sticky top-0 bg-white z-10 no-print">
          <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">Print Manifest</h2>
          </div>
          <div class="flex gap-3">
            <button onclick="document.getElementById('printModal').classList.add('hidden'); document.getElementById('printModal').classList.remove('flex');" class="px-4 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition-colors">Close</button>
            <button onclick="window.print()" class="px-5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-extrabold shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2z"></path></svg> 
              Print Now
            </button>
          </div>
        </div>
        <!-- Printable Content -->
        <div class="p-6 md:p-8 bg-white print:p-0" id="printContent">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
